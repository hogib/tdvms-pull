[project]
name = "tdvms"
version = "0.1.0"
description = "Bulk-download seismic waveform data from AFAD's TDVMS portal: unattended, resumable, with a terminal UI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Oguzb", email = "hoguzbolat@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["seismology", "afad", "tdvms", "miniseed", "earthquake", "waveform"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
# `requests` talks to the portal and downloads the archives. Everything else --
# the ledger, the lock, the mailbox -- is standard library on purpose: this runs
# unattended for days on a box whose other job is a 31 GB feature extraction,
# and a dependency that fails to import at 3 a.m. costs a queue slot.
dependencies = [
    "requests>=2.32",
]

[project.urls]
Homepage = "https://github.com/hogib/tdvms-pull"
Issues = "https://github.com/hogib/tdvms-pull/issues"

[project.scripts]
tdvms = "tdvms.cli:main"
tdvms-tui = "tdvms.tui:main"

[project.optional-dependencies]
# The TUI only. Optional for the reason above: `run` must never depend on it.
tui = [
    "textual>=8.2.8",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every failure this tool exists to prevent is a QUIET one: a slot held against
# a request nobody made, a station that answers nothing for a month, a reset
# that lands on the wrong station. None of them raise.
addopts = "-ra --strict-markers"
