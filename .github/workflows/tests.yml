# The test suite on every OS tdvms claims to run on.
#
# The Windows code paths are also tested on Linux, through stand-ins for msvcrt,
# icacls and PowerShell; this is where they meet the real thing.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra tui --locked
      - run: uv run pytest
        env:
          # Every OS: a text file opened without an encoding fails the suite
          # (see filterwarnings in pyproject.toml), not just on Windows.
          PYTHONWARNDEFAULTENCODING: "1"
